org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
# loom is not configuration-cache safe yet
org.gradle.configuration-cache=false

maven_group=net.moonbowstudios
mod_version=1.0.0
mod_id=worldvault

loom_version=1.17.19
loader_version=0.19.3

# lower of the two java floors, so both modules can consume core
core_java=21

# 26.x ships unobfuscated, so the no-remap loom plugin. compiled against 26.2 but runs on 26.1-26.3,
# so the shims must not reference RenderPipeline (it moved package in 26.3)
mc_262_minecraft=26.2
# the trailing '-' matters: plain '<26.4' also matches '26.4-snapshot-2'
mc_262_range=>=26.1 <26.4-
mc_262_label=26.1-26.3
mc_262_java=25
mc_262_fabric_api=0.157.0+26.2

# 1.21.9 and 1.21.10 still call the class ResourceLocation, renamed to Identifier in 1.21.11
mc_12111_minecraft=1.21.11
mc_12111_range=1.21.11
mc_12111_label=1.21.11
mc_12111_java=21
mc_12111_fabric_api=0.141.6+1.21.11
