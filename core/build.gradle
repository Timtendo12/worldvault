plugins {
	id 'java-library'
}

repositories {
	mavenCentral()
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(project.core_java as int)
	}
	withSourcesJar()
}

dependencies {
	// both target versions ship these; pinned to the lower one so core cannot outrun it
	compileOnly 'com.google.code.gson:gson:2.13.2'
	compileOnly 'net.java.dev.jna:jna:5.17.0'
	compileOnly 'net.java.dev.jna:jna-platform:5.17.0'
	compileOnly 'org.slf4j:slf4j-api:2.0.17'

	testImplementation 'com.google.code.gson:gson:2.13.2'
	testImplementation 'net.java.dev.jna:jna:5.17.0'
	testImplementation 'net.java.dev.jna:jna-platform:5.17.0'
	testImplementation 'org.slf4j:slf4j-api:2.0.17'
	testImplementation 'org.slf4j:slf4j-simple:2.0.17'
	testImplementation platform('org.junit:junit-bom:5.11.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// client ids come from a gitignored secrets.properties, or the matching env vars in CI.
// a clone without either builds fine and falls back to whatever is in config.json.
def clientDefaults = providers.provider {
	def props = new Properties()
	def file = rootProject.file('secrets.properties')
	if (file.exists()) {
		file.withInputStream { props.load(it) }
	}
	[
		'dropbox.clientId'    : System.getenv('WORLDVAULT_DROPBOX_CLIENT_ID') ?: props.getProperty('dropbox.clientId', ''),
		'google.clientId'     : System.getenv('WORLDVAULT_GOOGLE_CLIENT_ID') ?: props.getProperty('google.clientId', ''),
		'google.tokenEndpoint': System.getenv('WORLDVAULT_GOOGLE_TOKEN_ENDPOINT') ?: props.getProperty('google.tokenEndpoint', ''),
		'usage.endpoint'      : System.getenv('WORLDVAULT_USAGE_ENDPOINT') ?: props.getProperty('usage.endpoint', ''),
	]
}

def generatedClientDir = layout.buildDirectory.dir('generated/clients')

def generateClientDefaults = tasks.register('generateClientDefaults') {
	def values = clientDefaults
	def target = generatedClientDir.map { it.file('worldvault-clients.properties') }
	inputs.property 'clients', values
	outputs.file target
	doLast {
		def out = target.get().asFile
		out.parentFile.mkdirs()
		def lines = values.get().collect { key, value -> "${key}=${value}" }
		out.withWriter('UTF-8') { writer ->
			lines.each { writer.writeLine(it) }
		}
	}
}

sourceSets.main.output.dir(generatedClientDir, builtBy: generateClientDefaults)

tasks.register('harness', JavaExec) {
	group = 'verification'
	description = 'Exercises snapshot, upload, download and verification against a linked account.'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'net.moonbowstudios.worldvault.core.SyncHarnessMain'
	standardInput = System.in
}

tasks.named('test', Test) {
	useJUnitPlatform()
	testLogging { events 'passed', 'skipped', 'failed' }

	// gradle keeps -D on its own jvm, so forward it to the forked test jvm
	def keychainIt = System.getProperty('worldvault.keychain.it')
	if (keychainIt != null) {
		systemProperty 'worldvault.keychain.it', keychainIt
	}
}
